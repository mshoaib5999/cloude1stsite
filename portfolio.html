    const { useState, useEffect, useRef } = React;

    // --- LoadingScreen ---
    const LoadingScreen = ({ onComplete }) => {
      const [count, setCount] = useState(0);
      const [wordIndex, setWordIndex] = useState(0);
      const [isFading, setIsFading] = useState(false);
      const words = ["Design", "Create", "Optimize", "Scale"];

      useEffect(() => {
        const startTime = performance.now();
        const duration = 2700;

        const updateCounter = (currentTime) => {
          const elapsed = currentTime - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const currentCount = Math.floor(progress * 100);
          setCount(currentCount);

          if (progress < 1) {
            requestAnimationFrame(updateCounter);
          } else {
            setCount(100);
            setTimeout(() => {
              setIsFading(true);
              setTimeout(onComplete, 400);
            }, 100);
          }
        };

        const animFrame = requestAnimationFrame(updateCounter);
        return () => cancelAnimationFrame(animFrame);
      }, [onComplete]);

      useEffect(() => {
        const interval = setInterval(() => {
          setWordIndex((prev) => (prev + 1) % words.length);
        }, 900);
        return () => clearInterval(interval);
      }, [words.length]);

      return (
        <div className={`fixed inset-0 z-[9999] bg-bg flex flex-col justify-between p-6 md:p-12 transition-opacity duration-500 ease-out ${isFading ? 'opacity-0 pointer-events-none' : 'opacity-100'}`}>

                <span className="text-4xl md:text-6xl lg:text-7xl font-display italic text-text-primary/90 tracking-tight">
                  {word}
                </span>
              </div>
            ))}
          </div>

                SENIOR WORDPRESS DEVELOPER

                {String(count).padStart(3, "0")}

            </div>
          </div>
        </div>
      );
    };
